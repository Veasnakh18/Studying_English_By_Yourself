<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini AI Search Engine</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f9f9f9;
        }
        .search-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        input[type="text"] {
            width: 75%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 20%;
            padding: 10px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-item {
            background: #e9ecef;
            padding: 10px;
            margin-top: 10px;
            border-left: 5px solid #28a745;
            border-radius: 4px;
        }
        .no-result {
            color: #dc3545;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="search-box">
        <h2>🔍 Mini Google AI</h2>
        
        <form id="put" onsubmit="handleSearch(event)">
            <input type="text" id="searchQuery" placeholder="Try: javascript, gym, dinner..." required>
            <button type="submit">Search</button>
        </form>

        <div id="result"></div>
    </div>

</script>

</body>
</html>
